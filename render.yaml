services:
  # Backend API Service
  - type: web
    name: weather-app-backend
    runtime: node
    region: oregon
    plan: starter
    buildCommand: |
      cd apps/backend &&
      npm install -g pnpm &&
      pnpm install &&
      pnpm run build
    startCommand: cd apps/backend && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        fromService:
          type: web
          name: weather-app-frontend
          property: host
      - key: OPENWEATHER_API_KEY
        sync: false  # You'll set this manually in Render dashboard
      - key: OPENWEATHER_BASE_URL
        value: https://api.openweathermap.org/data/2.5
    healthCheckPath: /health
    
  # Frontend Static Site
  - type: web
    name: weather-app-frontend
    runtime: static
    region: oregon
    plan: starter
    buildCommand: |
      npm install -g pnpm &&
      pnpm install &&
      cd packages/shared && pnpm run build &&
      cd ../../apps/frontend && pnpm run build
    staticPublishPath: ./apps/frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: weather-app-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
